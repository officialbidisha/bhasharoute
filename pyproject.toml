[project]
name = "bhasharoute"
version = "0.1.0"
description = "Calibrated, code-mix-robust intent routing for English/Hindi/Bengali assistant requests, with an independent side-effect gate"
readme = "README.md"
authors = [
    { name = "Bidisha Das", email = "officialbidisha1@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.161.0",
    "indic-transliteration>=2.3.82",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "protobuf>=7.36.2",
    "psutil>=7.2.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "sentencepiece>=0.2.2",
    "torch>=2.14.1",
    "transformers>=5.20.2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["artifacts: needs trained model artifacts in artifacts/ (skipped if absent)"]
